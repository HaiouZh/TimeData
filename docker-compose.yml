services:
  timedata:
    image: ghcr.io/haiouzh/timedata:${TIMEDATA_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: timedata
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ${DIARY_VAULT_HOST_DIR:-./vault}:/app/vault
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN}
      - AGENT_TOKEN=${AGENT_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - NODE_ENV=production
      - DB_PATH=${DB_PATH:-/app/data/timedata.db}
      - PORT=3000
      - WATCHTOWER_URL=http://watchtower:8080
      - WATCHTOWER_TOKEN=${WATCHTOWER_TOKEN}
      - UPDATE_REPO=${UPDATE_REPO:-HaiouZh/TimeData}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DIARY_VAULT_DIR=${DIARY_VAULT_DIR-/app/vault}
    depends_on:
      - watchtower
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - timedata-internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: timedata-watchtower
    restart: unless-stopped
    command:
      - --label-enable
      - --cleanup
      - --http-api-update
      - --http-api-periodic-polls=false
    environment:
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_TOKEN}
      - DOCKER_API_VERSION=1.44
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - timedata-internal

  # GeoLite2 免费库每月第一个周二更新;官方镜像的默认下载文件名与 geoip.ts 里
  # 硬编码的一致(GeoLite2-City.mmdb / GeoLite2-ASN.mmdb),无需改代码。
  # 可选:.env 里配了 MaxMind 凭据并设 COMPOSE_PROFILES=geoip 才启动。
  # 不接 timedata-internal:它只需要出网访问 updates.maxmind.com,没理由够得着应用容器。
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v8.0.0
    container_name: timedata-geoipupdate
    profiles: ["geoip"]
    environment:
      - GEOIPUPDATE_ACCOUNT_ID=${GEOIPUPDATE_ACCOUNT_ID}
      - GEOIPUPDATE_LICENSE_KEY=${GEOIPUPDATE_LICENSE_KEY}
      - GEOIPUPDATE_EDITION_IDS=GeoLite2-City GeoLite2-ASN
      - GEOIPUPDATE_FREQUENCY=168
    volumes:
      - ./data/geoip:/usr/share/GeoIP
    user: "1000:1000"
    restart: unless-stopped

networks:
  timedata-internal:
