[package]
name = "timedata-desktop"
version = "0.1.0"
description = "TimeData Windows 桌面壳"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 前台判定要直接问 Win32：tao 的 is_focused() 在 WebView2 抢走焦点后会误报（见 shell.rs
# resolve_is_foreground）。版本与 features 跟 tauri 自己的这条依赖对齐，复用同一份编译产物。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
