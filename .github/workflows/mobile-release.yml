name: mobile-release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "构建哪个平台"
        type: choice
        options: [both, android, ios, windows]
        default: both
      tag:
        description: "补包到已有 Release（形如 v26080101）；留空则算新版本号"
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "packages/client/**"
      - "packages/mobile/**"
      - "packages/desktop/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "scripts/mobile-version.mjs"
      - "scripts/desktop-version.mjs"
      - "scripts/ios-app-icon.mjs"
      - "scripts/generate-icons.mjs"
      - "icon.png"
      - ".github/workflows/mobile-release.yml"

permissions:
  contents: read

# 版本号在 prepare 单点计算，撞号已从结构上消失；
# 仍然排队（不取消）避免同日多次触发并发算出同一个序号。
concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      source_ref: ${{ steps.release.outputs.source_ref }}
      run_android: ${{ steps.platform.outputs.android }}
      run_ios: ${{ steps.platform.outputs.ios }}
      run_windows: ${{ steps.platform.outputs.windows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 发布只允许 main：workflow_dispatch 可从 UI 选任意分支，而 push 只限 main。
      # 现行两个 workflow 的 Publish 步骤本有 if: main，合流后前移为整条链入口守卫。
      - name: Enforce main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "发布链路只允许从 main 触发，当前 ref: ${{ github.ref }}，已中止。"
          exit 1

      # push 触发时 inputs.platform 是空串，必须当作 both。
      - name: Resolve platform selection
        id: platform
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          SEL="${PLATFORM:-both}"
          case "$SEL" in
            both)
              echo "android=true" >> "$GITHUB_OUTPUT"
              echo "ios=true" >> "$GITHUB_OUTPUT"
              echo "windows=true" >> "$GITHUB_OUTPUT"
              ;;
            android)
              echo "android=true" >> "$GITHUB_OUTPUT"
              echo "ios=false" >> "$GITHUB_OUTPUT"
              echo "windows=false" >> "$GITHUB_OUTPUT"
              ;;
            ios)
              echo "android=false" >> "$GITHUB_OUTPUT"
              echo "ios=true" >> "$GITHUB_OUTPUT"
              echo "windows=false" >> "$GITHUB_OUTPUT"
              ;;
            windows)
              echo "android=false" >> "$GITHUB_OUTPUT"
              echo "ios=false" >> "$GITHUB_OUTPUT"
              echo "windows=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "platform 必须是 both / android / ios / windows 之一，收到：$SEL"
              exit 1
              ;;
          esac

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Compute version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            node scripts/mobile-version.mjs --tag "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            node scripts/mobile-version.mjs >> "$GITHUB_OUTPUT"
          fi

      - name: Create or verify release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          RELEASE_NAME: TimeData ${{ steps.version.outputs.code }}
          INPUT_TAG: ${{ inputs.tag }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          # 补包模式：目标 Release 必须已存在，且不碰标题 / 说明 / latest 标记。
          # source_ref 指向目标 tag 的源码——补包构建必须用原版本代码，不能是运行分支 HEAD。
          if [ -n "$INPUT_TAG" ]; then
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "source_ref=refs/tags/${TAG_NAME}" >> "$GITHUB_OUTPUT"
              echo "补包到已有 Release $TAG_NAME"
              exit 0
            fi
            echo "补包目标 Release $TAG_NAME 不存在。"
            exit 1
          fi

          BODY=$(cat <<EOF
          TimeData \`${TAG_NAME}\`，构建自 \`${BUILD_SHA}\`。

          **Android**：下载 \`app-release.apk\`，安装时需手动确认。使用固定的 TimeData release 签名，可覆盖更新既有版本。

          **iOS**：下载 \`TimeData-unsigned.ipa\`。该 IPA 未签名，不能直接安装——用 SideStore 或 AltStore 导入，安装时会用你的 Apple ID 自动签名（免费账号签名 7 天有效，SideStore 可在手机上自行续签）。

          **Windows**：下载 \`TimeData-Setup.exe\` 安装。安装包未做代码签名，SmartScreen 会提示"已保护你的电脑"，点"更多信息 → 仍要运行"即可。装好后常驻托盘，关窗口不退出，开机自启默认开。

          iOS 构建比 Android 慢十几分钟，IPA 可能稍后才出现在本页。
          EOF
          )

          echo "source_ref=${BUILD_SHA}" >> "$GITHUB_OUTPUT"

          for attempt in 1 2 3; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              exit 0
            fi
            # 显式 --latest=false：gh 的 --latest 默认是 automatic，对 v<8位> 这类
            # 非 semver tag 按创建时间自动成为 latest——不关掉的话 prepare 一创建就把
            # latest 从上一个带 APK 的 Release 抢走，Android 构建失败时更是永久停在
            # 没有 APK 的 Release 上（spec §1.2 事故重演）。latest 只能由 android job
            # 上传成功后 gh release edit --latest 落位（见下方 Publish APK 步骤）。
            if gh release create "$TAG_NAME" --target "$BUILD_SHA" --title "$RELEASE_NAME" --notes "$BODY" --latest=false; then
              exit 0
            fi
            echo "Release 创建第 $attempt 次失败，重试中..."
            sleep $((attempt * 10))
          done

          echo "Release 创建三次均失败。"
          exit 1

  android:
    needs: prepare
    if: needs.prepare.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode release keystore
        env:
          TIMEDATA_RELEASE_KEYSTORE_BASE64: ${{ secrets.TIMEDATA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TIMEDATA_RELEASE_KEYSTORE_BASE64" ]; then
            echo "TIMEDATA_RELEASE_KEYSTORE_BASE64 repository secret is not configured."
            exit 1
          fi
          printf '%s' "$TIMEDATA_RELEASE_KEYSTORE_BASE64" | base64 --decode > packages/mobile/android/timedata-release.keystore

      - name: Allow Gradle wrapper execution
        run: chmod +x packages/mobile/android/gradlew

      - name: Build signed release APK
        env:
          TIMEDATA_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.code }}
          ORG_GRADLE_PROJECT_TIMEDATA_ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.code }}
          ORG_GRADLE_PROJECT_TIMEDATA_RELEASE_STORE_FILE: ../timedata-release.keystore
          ORG_GRADLE_PROJECT_TIMEDATA_RELEASE_STORE_PASSWORD: ${{ secrets.TIMEDATA_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_TIMEDATA_RELEASE_KEY_ALIAS: ${{ secrets.TIMEDATA_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_TIMEDATA_RELEASE_KEY_PASSWORD: ${{ secrets.TIMEDATA_RELEASE_KEY_PASSWORD }}
        run: pnpm build:mobile:release-apk

      - name: Cleanup release keystore
        if: always()
        run: rm -f packages/mobile/android/timedata-release.keystore

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: timedata-release-apk
          path: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # latest 只由带 APK 的 Release 承担：设置页「APK 更新」与更早那批
      # 走 /releases/latest 的客户端都依赖 latest 里存在 .apk 资产。
      # prepare 已显式 --latest=false，latest 落位见下方 Mark release as latest 步骤。
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          APK_PATH: packages/mobile/android/app/build/outputs/apk/release/app-release.apk
        run: |
          for attempt in 1 2 3; do
            if gh release upload "$TAG_NAME" "$APK_PATH" --clobber; then
              exit 0
            fi
            echo "APK 上传第 $attempt 次失败，重试中..."
            sleep $((attempt * 10))
          done
          echo "APK 上传三次均失败。"
          exit 1

      # latest 只由带 APK 且为新发版的 Release 承担：设置页「APK 更新」与更早那批
      # 走 /releases/latest 的客户端都依赖 latest 里存在 .apk 资产。
      # 补包（inputs.tag 非空）不碰 latest——把 latest 从最新版回拨到旧版会让
      # 走 /releases/latest 的客户端误判「没有新版本」而停更。
      - name: Mark release as latest
        if: ${{ inputs.tag == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG_NAME" --latest

  ios:
    needs: prepare
    if: needs.prepare.outputs.run_ios == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # iOS 原生工程不进仓库，每次现场生成（见 packages/mobile/README.md）。
      # @capacitor/ios 也只在 CI 安装，版本跟随 @capacitor/core，避免本地 lockfile 漂移。
      - name: Add @capacitor/ios (CI only)
        run: |
          # 读已安装 core 的 exact resolved version（如 7.6.7），不用 package.json 里的
          # ^7.6.7 范围——范围解析会随未来 patch 漂移，@capacitor/ios 模板结构也随之漂移。
          CORE_VERSION=$(node -p "require('./packages/mobile/node_modules/@capacitor/core/package.json').version")
          pnpm --filter @timedata/mobile add "@capacitor/ios@${CORE_VERSION}"

      - name: Build web assets (mobile mode)
        run: pnpm --filter @timedata/mobile build:web

      - name: Generate iOS project
        run: pnpm --filter @timedata/mobile exec cap add ios

      - name: Patch iOS project (remove keyboard accessory bar)
        run: |
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          cd packages/mobile && ruby scripts/ios/patch-ios.rb

      - name: Install app icon
        run: |
          node scripts/ios-app-icon.mjs \
            packages/mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset \
            packages/mobile/ios-assets/AppIcon-1024.png

      - name: Sync web assets & pods
        run: pnpm --filter @timedata/mobile exec cap sync ios

      - name: Set bundle version
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.code }}
        run: |
          PLIST=packages/mobile/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER}" "$PLIST"

      - name: Build unsigned archive
        run: |
          xcodebuild -workspace packages/mobile/ios/App/App.xcworkspace \
            -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          cd "$RUNNER_TEMP"
          mkdir Payload
          cp -R App.xcarchive/Products/Applications/App.app Payload/
          zip -qry TimeData-unsigned.ipa Payload
          ls -la TimeData-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: timedata-unsigned-ipa
          path: ${{ runner.temp }}/TimeData-unsigned.ipa
          if-no-files-found: error

      # 刻意不碰 latest 标记：那是带 APK 的 Release 的专属（prepare 已 --latest=false，
      # 这里再碰 latest 会把客户端更新判断打挂）。
      - name: Publish IPA to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          IPA_PATH: ${{ runner.temp }}/TimeData-unsigned.ipa
        run: |
          for attempt in 1 2 3; do
            if gh release upload "$TAG_NAME" "$IPA_PATH" --clobber; then
              exit 0
            fi
            echo "IPA 上传第 $attempt 次失败，重试中..."
            sleep $((attempt * 10))
          done
          echo "IPA 上传三次均失败。"
          exit 1

  windows:
    needs: prepare
    if: needs.prepare.outputs.run_windows == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Tauri 的 version 必须是 semver，而发布链路的版本码是 8 位数字，
      # 转换口径只有 scripts/desktop-version.mjs 一处（见其单测）。
      - name: Compute Tauri semver
        id: semver
        shell: bash
        run: node scripts/desktop-version.mjs --code "${{ needs.prepare.outputs.code }}" >> "$GITHUB_OUTPUT"

      - name: Build NSIS installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密钥生成时用的是空密码短语，已实测该形态可正常签名，故不建第二个 Secret。
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          pnpm --filter @timedata/desktop exec tauri build \
            --config "{\"version\":\"${{ steps.semver.outputs.semver }}\"}"

      # bundler 的输出文件名带版本号，改成固定名字方便 Release 页面上认。
      - name: Rename installer
        shell: bash
        run: |
          SRC=$(find packages/desktop/src-tauri/target/release/bundle/nsis -name "*-setup.exe" | head -1)
          if [ -z "$SRC" ]; then
            echo "没找到 NSIS 安装包，bundler 可能没产出。"
            ls -R packages/desktop/src-tauri/target/release/bundle || true
            exit 1
          fi
          mv "$SRC" "$RUNNER_TEMP/TimeData-Setup.exe"
          ls -la "$RUNNER_TEMP/TimeData-Setup.exe"
          if [ ! -f "$SRC.sig" ]; then
            echo "没找到 $SRC.sig。createUpdaterArtifacts 没开，或签名密钥没注入。"
            ls -la "$(dirname "$SRC")"
            exit 1
          fi
          cp "$SRC.sig" "$RUNNER_TEMP/TimeData-Setup.exe.sig"

      # latest.json 的 signature 是 .sig 的内容（不是路径）。校验逻辑在
      # scripts/updater-manifest.mjs 里，有单测锁着，此处只负责调用。
      - name: Build latest.json
        shell: bash
        run: |
          node scripts/updater-manifest.mjs \
            --version "${{ steps.semver.outputs.semver }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --sig-file "$RUNNER_TEMP/TimeData-Setup.exe.sig" \
            --out "$RUNNER_TEMP/latest.json"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: timedata-windows-setup
          path: ${{ runner.temp }}/TimeData-Setup.exe
          if-no-files-found: error

      # 刻意不碰 latest 标记：那是带 APK 的 Release 的专属（prepare 已 --latest=false，
      # 这里再碰 latest 会把 Android 应用内更新打挂）。与 ios job 同规矩。
      - name: Publish installer to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
          EXE_PATH: ${{ runner.temp }}/TimeData-Setup.exe
        run: |
          for attempt in 1 2 3; do
            if gh release upload "$TAG_NAME" "$EXE_PATH" --clobber; then
              exit 0
            fi
            echo "安装包上传第 $attempt 次失败，重试中..."
            sleep $((attempt * 10))
          done
          echo "安装包上传三次均失败。"
          exit 1

      # 更新源固定在 desktop-latest 这个 tag 上，与各版本自己的 Release 分离。
      # 不用 releases/latest/download/：那个 latest 标记是带 APK 的 Release 专属。
      - name: Publish latest.json to updater channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JSON_PATH: ${{ runner.temp }}/latest.json
        run: |
          for attempt in 1 2 3; do
            if gh release upload desktop-latest "$JSON_PATH" --clobber; then
              exit 0
            fi
            echo "latest.json 上传第 $attempt 次失败，重试中..."
            sleep $((attempt * 10))
          done
          echo "latest.json 上传三次均失败。"
          exit 1
